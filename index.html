<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kai sound lab</title>
    <meta
      name="description"
      content="A library of synthesized, reusable UI and game sounds — recipes as the canonical asset — with notes on the psychology of sound."
    />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="cb" content="f36f4986">
  <link rel="icon" type="image/svg+xml" href="/cb-shapes/51.svg?v=f36f4986">
  <script src="/cb-badge.js?v=f36f4986" defer></script>
  </head>
  <body>
    <header class="faceplate">
      <div class="brand">
        <h1>KAI&nbsp;SOUND&nbsp;LAB</h1>
        <p class="tagline">synthesized sound recipes · nothing recorded, everything reproducible</p>
      </div>
      <nav class="tabs" aria-label="Views">
        <button class="tab is-active" data-tab="lab" aria-pressed="true">Lab</button>
        <button class="tab" data-tab="library" aria-pressed="false">Library</button>
        <button class="tab" data-tab="devlog" aria-pressed="false">Devlog</button>
        <button class="version-chip" id="version-chip" title="Build token — opens the devlog">
          v<span id="version-token">dev</span>
        </button>
      </nav>
    </header>

    <div id="view-lab" class="view">
      <aside class="rack" aria-label="Preset rack">
        <p class="rack-label">UI family · 10 presets</p>
        <ul id="preset-list"></ul>
      </aside>
      <main class="panel" id="detail-panel">
        <p class="empty">Select a sound from the rack.</p>
      </main>
    </div>

    <div id="view-library" class="view is-hidden">
      <aside class="rack" aria-label="Curated library">
        <p class="rack-label" id="library-label"></p>
        <ul id="library-list"></ul>
      </aside>
      <main class="panel" id="library-panel">
        <p class="empty">Select a sound from a curated set.</p>
      </main>
    </div>

    <div id="view-devlog" class="view is-hidden">
      <main class="devlog" id="devlog-body" aria-label="Developer log"></main>
    </div>

    <script type="module" src="/src/app/main.ts?v=f36f4986"></script>
  </body>
</html>
